services:
  relay:
    ports: !reset []

  pairing-relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
      pairing-relay:
        condition: service_healthy
    environment:
      BUZZ_DOMAIN: ${BUZZ_DOMAIN:?set BUZZ_DOMAIN}
      BUZZ_PAIRING_DOMAIN: ${BUZZ_PAIRING_DOMAIN:?set BUZZ_PAIRING_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
    labels:
      com.buzz.volume: embedded-caddy-data
  caddy-config:
    labels:
      com.buzz.volume: embedded-caddy-config
