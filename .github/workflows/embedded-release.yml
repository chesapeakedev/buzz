name: Embedded Buzz release

on:
  push:
    tags: ["relay-v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Bare relay version (for an existing relay-v tag)"
        required: true

permissions: {}

jobs:
  publish:
    if: github.repository == 'chesapeakedev/buzz'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10e
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound source
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#relay-v}}"
          scripts/verify-release-ref.sh relay-v "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Wait for published relay image
        env:
          IMAGE: ghcr.io/chesapeakedev/buzz
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for attempt in {1..30}; do
            if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              docker manifest inspect "$IMAGE:$VERSION" > image-manifest.json
              break
            fi
            sleep 20
          done
          test -s image-manifest.json

      - name: Package embedded distribution
        run: |
          mkdir -p dist
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "dist/buzz-embedded-${VERSION}.tar.gz" \
            deploy/embedded README.md docs/single-node-embedded-backends.md \
            UPSTREAM.md migrations
          sha256sum "dist/buzz-embedded-${VERSION}.tar.gz" > "dist/buzz-embedded-${VERSION}.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "relay-v${VERSION}" \
            "dist/buzz-embedded-${VERSION}.tar.gz" \
            "dist/buzz-embedded-${VERSION}.tar.gz.sha256" \
            --repo chesapeakedev/buzz \
            --title "Embedded Buzz ${VERSION}" \
            --generate-notes
