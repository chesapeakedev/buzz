name: Embedded restart soak

on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Number of write/search/restart cycles"
        required: true
        default: "720"
      cycle_seconds:
        description: "Write duration per cycle"
        required: true
        default: "60"
      connections:
        description: "Authenticated clients per cycle"
        required: true
        default: "20"
      qps:
        description: "Aggregate writes per second per cycle"
        required: true
        default: "5"
      search_iterations:
        description: "NIP-50 searches per cycle"
        required: true
        default: "10"
      image:
        description: "Immutable embedded image"
        required: true
        default: "ghcr.io/chesapeakedev/buzz:0.3.0"

permissions: {}

jobs:
  soak:
    if: github.repository == 'chesapeakedev/buzz'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout fork harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run restart soak
        env:
          BUZZ_EMBEDDED_IMAGE: ${{ inputs.image }}
          BUZZ_SOAK_CYCLES: ${{ inputs.cycles }}
          BUZZ_SOAK_CYCLE_SECONDS: ${{ inputs.cycle_seconds }}
          BUZZ_SOAK_CONNECTIONS: ${{ inputs.connections }}
          BUZZ_SOAK_QPS: ${{ inputs.qps }}
          BUZZ_SOAK_SEARCH_ITERATIONS: ${{ inputs.search_iterations }}
          BUZZ_SOAK_OUTDIR: test-results/embedded-soak
        run: ./scripts/soak-embedded.sh

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedded-soak-${{ github.run_id }}
          path: test-results/embedded-soak
          if-no-files-found: warn
